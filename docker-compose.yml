services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - ai-chat
    restart: always

  webui:
    build: .
    container_name: ai_webui
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PYTHONUNBUFFERED=1
    volumes:
      # 專案程式碼
      - .:/app
      # 本次優化：明確映射資料資料夾
      - ./history:/app/history
      - ./logs:/app/logs
      - ./.streamlit:/app/.streamlit
    depends_on:
      - ollama
    networks:
      - ai-chat
    restart: always

networks:
  ai-chat:
    driver: bridge
